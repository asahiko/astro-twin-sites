name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The same commit is built and deployed once per target, in parallel.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The production domains: default URLs (packages/kit/src/sites.ts), www/brew and www/beans.
          - target: production
          # Subdirectories of the server's initial domain, kept out of search engines. The
          # origin comes from the PREVIEW_ORIGIN repository variable (https://<initial-domain>).
          - target: preview
            brew_dir: brew_preview
            beans_dir: beans_preview
    steps:
      - uses: actions/checkout@v5

      - name: Set site URLs
        id: urls
        if: matrix.target == 'preview'
        env:
          PREVIEW_ORIGIN: ${{ vars.PREVIEW_ORIGIN }}
        run: |
          origin=${PREVIEW_ORIGIN%/}
          if [ -z "$origin" ]; then
            # Still build, so the subdirectory build is checked; there is nowhere to deploy it.
            echo "::warning::PREVIEW_ORIGIN is not set; building the preview without deploying it."
            origin=https://preview.invalid
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "BREW_URL=$origin/${{ matrix.brew_dir }}/"
            echo "BEANS_URL=$origin/${{ matrix.beans_dir }}/"
            echo "NOINDEX=1"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds brew, then beans against brew's fresh feed, then brew again against beans' feed.
      - run: npm run build

      - name: Configure SSH
        id: ssh
        if: steps.urls.outputs.skip != 'true'
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_KNOWN_HOSTS: ${{ secrets.SAKURA_KNOWN_HOSTS }}
        run: |
          if [ -z "$SAKURA_SSH_KEY" ] || [ -z "$SAKURA_KNOWN_HOSTS" ]; then
            echo "::warning::Deploy secrets are not set; built only, skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SAKURA_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the connection fails rather than trusting an unknown server.
          printf '%s\n' "$SAKURA_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host sakura
            HostName $SAKURA_HOST
            User $SAKURA_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy beans
        if: steps.ssh.outputs.ready == 'true'
        env:
          DEPLOY_DIR: ${{ matrix.beans_dir }}
        run: scripts/deploy.sh beans

      - name: Deploy brew
        if: steps.ssh.outputs.ready == 'true'
        env:
          DEPLOY_DIR: ${{ matrix.brew_dir }}
        run: scripts/deploy.sh brew

      - name: Smoke test
        if: steps.ssh.outputs.ready == 'true'
        run: |
          # The same URLs the build used (packages/kit/src/sites.ts), ending in "/".
          for site in brew beans; do
            base=$(node -e 'import("./packages/kit/src/sites.ts").then((m) => console.log(m.siteUrl(process.argv[1]).href))' "$site")
            for url in "$base" "${base}news/feed/"; do
              curl -fsS -o /dev/null -w "%{http_code} %{content_type}  $url\n" "$url" \
                || echo "::warning::$url did not respond with 2xx (DNS/SSL may not be set up yet)"
            done
            if [ -n "$NOINDEX" ] && ! curl -fsSI "$base" | grep -qi '^x-robots-tag: *noindex'; then
              echo "::warning::$base has no X-Robots-Tag: noindex header"
            fi
          done
